# Android 15 / 16 KB page-size devices (Xiaomi 15 Ultra, Snapdragon 8 Elite).
# Cargo/Tauri do not pass these NDK 27 flags by default; 4 KB LOAD alignment
# crashes in native load before any Java UI can appear.
# `src-tauri/build.rs` also emits the same args for the final pebble_lib.so.

[target.aarch64-linux-android]
rustflags = [
    "-C", "link-arg=-Wl,-z,max-page-size=16384",
    "-C", "link-arg=-Wl,-z,common-page-size=16384",
    # Workspace release uses panic=abort. catch_unwind in run() needs unwind
    # on Android so a plugin/builder panic can write pebble-crash.log + UI.
    "-C", "panic=unwind",
]

[target.armv7-linux-androideabi]
rustflags = [
    "-C", "link-arg=-Wl,-z,max-page-size=16384",
    "-C", "link-arg=-Wl,-z,common-page-size=16384",
    "-C", "panic=unwind",
]

[target.x86_64-linux-android]
rustflags = [
    "-C", "link-arg=-Wl,-z,max-page-size=16384",
    "-C", "link-arg=-Wl,-z,common-page-size=16384",
    "-C", "panic=unwind",
]

[target.i686-linux-android]
rustflags = [
    "-C", "link-arg=-Wl,-z,max-page-size=16384",
    "-C", "link-arg=-Wl,-z,common-page-size=16384",
    "-C", "panic=unwind",
]
